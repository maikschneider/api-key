<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="callout callout-warning">
    <div class="callout-content">
        <div class="callout-title"><f:translate key="LLL:EXT:api_key/Resources/Private/Language/locallang_db.xlf:secret.title" arguments="{0: title, 1: identifier}" /></div>
        <div class="callout-body">
            <p><f:translate key="LLL:EXT:api_key/Resources/Private/Language/locallang_db.xlf:secret.message" /></p>
            <div class="input-group">
                <input type="text" class="form-control font-monospace" value="{secret}" readonly autocomplete="off" spellcheck="false" aria-label="{f:translate(key: 'LLL:EXT:api_key/Resources/Private/Language/locallang_db.xlf:secret.label')}" />
                <typo3-copy-to-clipboard
                    class="btn btn-default"
                    title="{f:translate(key: 'LLL:EXT:api_key/Resources/Private/Language/locallang_db.xlf:secret.copy')}"
                    text="{secret}"
                >
                    <core:icon identifier="actions-clipboard" size="small" />
                </typo3-copy-to-clipboard>
            </div>
        </div>
    </div>
</div>
</html>
