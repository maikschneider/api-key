services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MaikSchneider\ApiKey\:
    resource: '../Classes/*'

  MaikSchneider\ApiKey\Repository\ApiKeyRepository:
    public: true

  MaikSchneider\ApiKey\Key\ApiKeyCreator:
    public: true

  MaikSchneider\ApiKey\Authentication\ApiKeyAuthenticator:
    public: true

  MaikSchneider\ApiKey\Authentication\ApiKeyAuthenticatorInterface:
    alias: MaikSchneider\ApiKey\Authentication\ApiKeyAuthenticator
    public: true
